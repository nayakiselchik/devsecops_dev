name: CI/CD

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  build:
    name: Build & Sign & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure source file exists
        run: |
          if [ ! -f 41_scan_stream_default.py ]; then
            bash fetch_source.sh
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build pseudo-binary
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile 41_scan_stream_default.py --name scan_stream
          mkdir -p artifacts
          zip -j artifacts/artifact.zip 41_scan_stream_default.py dist/scan_stream* || true

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX/CycloneDX)
        run: |
          syft packages dir:. -o spdx-json > sbom.spdx.json
          syft packages dir:. -o cyclonedx-json > sbom.cyclonedx.json

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan SBOM with Grype
        run: |
          grype sbom:./sbom.spdx.json -o json > vulnerabilities.json

      - name: Install Cosign
        run: |
          curl -sSfL "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Cosign sign artifact (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/artifact.zip.sig \
            --output-certificate artifacts/artifact.zip.pem \
            artifacts/artifact.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            artifacts/artifact.zip
            artifacts/artifact.zip.sig
            artifacts/artifact.zip.pem
            sbom.spdx.json
            sbom.cyclonedx.json
            vulnerabilities.json

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: ossf/scorecard-action@v2.3.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  release:
    name: Release
    needs: [build, scorecard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact.zip
            artifact.zip.sig
            artifact.zip.pem
            sbom.spdx.json
            sbom.cyclonedx.json
            vulnerabilities.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
